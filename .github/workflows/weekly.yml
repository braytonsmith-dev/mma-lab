# Rebuilds the boards every Monday at 13:00 UTC (after the Sunday-night UFCStats
# refresh) and commits the outputs, so GitHub Pages serves a fresh board each week.
name: weekly-boards
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: bash scripts/refresh_data.sh --quick
      - name: Commit outputs
        run: |
          git config user.name "mma-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw outputs docs
          git commit -m "Weekly rebuild $(date -u +%F)" || echo "nothing to commit"
          git push
